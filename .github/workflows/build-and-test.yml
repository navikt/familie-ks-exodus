name: Build and Test reusable workflow
on:
  workflow_call:
    outputs:
      image:
        description: 'Docker image'
        value: ${{ jobs.build.outputs.image }}
      telemetry:
        description: 'Telemetry data'
        value: ${{ jobs.build.outputs.telemetry }}

jobs:
  build:
    name: "Bygg og test"
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.docker-build-push.outputs.image }}
      telemetry: ${{ steps.docker-build-push.outputs.telemetry }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build artifacts
        run: mvn --batch-mode verify --settings .m2/maven-settings.xml
        env:
          GITHUB_USERNAME: x-access-token
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Bygg og push docker image til GAR
        uses: nais/docker-build-push@0e73849f69ff260ee27597553c0a7848ca4e9795 # v0
        id: docker-build-push
        with:
          team: teamfamilie